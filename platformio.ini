[env:m5stack-atom]
platform = espressif32@6.10.0
board = m5stack-atom
framework = arduino
monitor_speed = 115200
monitor_encoding = UTF-8
board_build.partitions = huge_app.csv
lib_deps =
    https://github.com/MinteliaShip/servoICS.git#Dev
    https://github.com/aed3/PS4-esp32.git
    https://github.com/hideakitai/ArduinoEigen#v0.3.2

build_flags = 
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=4096 ; loopタスクのスタックサイズ削減（8KB -> 4KB）
    -DCONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST=0 ; PSRAM検索のオーバーヘッド回避
    -ffunction-sections                   ; 未使用関数のリンク時削減準備
    -fdata-sections                      ; 未使用変数のリンク時削減準備
    -Wl,--gc-sections                    ; 未使用セクションの自動削除（SRAM/Flash双方を最適化）